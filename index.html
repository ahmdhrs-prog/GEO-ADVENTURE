  <!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Geo Adventure: Ekspedisi Flora dan Fauna Nusantara</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --hijau-hutan: #246B45;
      --hijau-gelap: #184A2F;
      --hijau-muda: #8BCB75;
      --kuning: #F3C96B;
      --oranye: #E99555;
      --oranye-gelap: #C87132;
      --biru-langit: #83C9DC;
      --krem: #F6E9CF;
      --kayu-terang: #C9823E;
      --kayu-gelap: #7A4419;
      --teks-gelap: #2B2118;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background-color: #133622;
      color: var(--teks-gelap);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    #app-container {
      width: 100%;
      max-width: 1140px;
      min-height: 675px;
      background: linear-gradient(180deg, var(--biru-langit) 0%, #BCE6F2 48%, var(--hijau-muda) 49%, var(--hijau-hutan) 100%);
      border-radius: 24px;
      border: 8px solid var(--kayu-gelap);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px 26px;
      transition: background 0.6s ease;
    }

    #app-container.bg-asiatis { background: linear-gradient(180deg, #69B578 0%, #2E7D4B 55%, #194D2D 100%); }
    #app-container.bg-peralihan { background: linear-gradient(180deg, #83C9DC 0%, #F3D999 58%, #D69E52 100%); }
    #app-container.bg-australis { background: linear-gradient(180deg, #5EB5D6 0%, #3E8E63 55%, #1E5638 100%); }
    #app-container.bg-rusak { background: linear-gradient(180deg, #A39B8B 0%, #7D6B5D 55%, #4A3B32 100%); }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      gap: 10px;
      flex-wrap: wrap;
    }

    .mission-badge {
      background: var(--krem);
      border: 4px solid var(--kayu-gelap);
      border-radius: 50px;
      padding: 6px 18px;
      font-family: 'Fredoka', sans-serif;
      font-size: 1rem;
      color: var(--hijau-hutan);
      box-shadow: 0 4px 0 var(--kayu-gelap);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hud-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge-tray {
      background: rgba(246, 233, 207, 0.94);
      border: 3px solid var(--kayu-gelap);
      border-radius: 50px;
      padding: 5px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      font-weight: 800;
    }

    .badge-slot {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #D5C5A8;
      border: 2px dashed #8C7355;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .badge-slot.unlocked {
      background: var(--kuning);
      border: 2px solid var(--kayu-gelap);
      transform: scale(1.15);
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    }

    .wood-board {
      background: linear-gradient(180deg, #D9944A 0%, #B86F28 100%);
      border: 5px solid var(--kayu-gelap);
      border-radius: 22px;
      box-shadow: 0 8px 0 var(--kayu-gelap), inset 0 3px 0 rgba(255,255,255,0.35);
      padding: 16px 28px;
      text-align: center;
    }

    .wood-title {
      font-family: 'Fredoka', sans-serif;
      color: var(--kuning);
      text-shadow: 3px 3px 0 var(--kayu-gelap), -1px -1px 0 var(--kayu-gelap), 1px -1px 0 var(--kayu-gelap), -1px 1px 0 var(--kayu-gelap);
      letter-spacing: 1px;
    }

    .parchment-panel {
      background: var(--krem);
      border: 5px solid var(--kayu-gelap);
      border-radius: 22px;
      box-shadow: 0 8px 0 rgba(74, 42, 16, 0.4);
      padding: 18px 22px;
    }

    .btn {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.1rem;
      padding: 11px 24px;
      border-radius: 50px;
      border: 4px solid var(--kayu-gelap);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.2s;
    }

    .btn:hover { filter: brightness(1.06); transform: translateY(-2px); }
    .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--kayu-gelap) !important; }

    .btn-primary {
      background: linear-gradient(180deg, var(--kuning) 0%, var(--oranye) 100%);
      color: var(--teks-gelap);
      box-shadow: 0 5px 0 var(--kayu-gelap);
    }

    .btn-green {
      background: linear-gradient(180deg, var(--hijau-muda) 0%, var(--hijau-hutan) 100%);
      color: #FFFFFF;
      text-shadow: 1px 1px 0 var(--kayu-gelap);
      box-shadow: 0 5px 0 var(--kayu-gelap);
    }

    .btn-secondary {
      background: var(--krem);
      color: var(--kayu-gelap);
      box-shadow: 0 5px 0 var(--kayu-gelap);
    }

    .btn-audio-inline {
      background: var(--biru-langit);
      color: var(--teks-gelap);
      border: 2.5px solid var(--kayu-gelap);
      border-radius: 20px;
      padding: 3px 11px;
      font-family: 'Fredoka', sans-serif;
      font-size: 0.82rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-left: 6px;
      transition: transform 0.15s;
    }

    .btn-audio-inline:hover {
      background: var(--kuning);
      transform: scale(1.05);
    }

    .btn-small {
      font-size: 0.9rem;
      padding: 6px 13px;
      border-width: 3px;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 5;
      margin: 10px 0;
      animation: fadeSlideIn 0.35s ease;
    }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .bima-box {
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(255, 255, 255, 0.96);
      border: 4px solid var(--hijau-hutan);
      border-radius: 20px;
      padding: 10px 18px;
      max-width: 880px;
      width: 100%;
      box-shadow: 0 6px 15px rgba(0,0,0,0.15);
      margin-top: 10px;
    }

    .bima-avatar {
      width: 66px;
      height: 66px;
      border-radius: 50%;
      background: var(--kuning);
      border: 4px solid var(--kayu-gelap);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }

    .bima-speech {
      font-size: 0.98rem;
      line-height: 1.4;
      font-weight: 700;
      color: var(--teks-gelap);
      flex: 1;
    }

    .bima-name {
      display: inline-block;
      background: var(--hijau-hutan);
      color: #fff;
      font-family: 'Fredoka', sans-serif;
      font-size: 0.78rem;
      padding: 2px 10px;
      border-radius: 12px;
      margin-bottom: 4px;
    }

    /* Kartu Foto Flora & Fauna */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      width: 100%;
    }

    .bio-card {
      background: #FFFFFF;
      border: 4px solid var(--kayu-gelap);
      border-radius: 18px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 5px 0 var(--kayu-gelap);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .bio-card:hover {
      transform: translateY(-5px) scale(1.02);
      background: #FFFDF7;
    }

    .real-photo-thumb {
      width: 100%;
      height: 118px;
      object-fit: contain;
      border-radius: 12px;
      border: 2px solid #EAE0CC;
      margin-bottom: 8px;
      background-color: #FFFFFF;
      padding: 4px;
    }

    .preview-strip {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin: 12px 0;
    }

    .preview-strip img {
      width: 110px;
      height: 88px;
      object-fit: contain;
      background: #FFFFFF;
      padding: 4px;
      border-radius: 14px;
      border: 3px solid var(--kayu-gelap);
      box-shadow: 0 3px 6px rgba(0,0,0,0.2);
    }

    .bio-card h4 {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.05rem;
      color: var(--hijau-hutan);
    }

    .tag-hint {
      font-size: 0.78rem;
      background: var(--krem);
      padding: 2px 10px;
      border-radius: 10px;
      display: inline-block;
      margin-top: 4px;
      color: var(--kayu-gelap);
      font-weight: 800;
    }

    /* Bingkai Peta Indonesia */
    .indo-map-frame {
      width: 100%;
      max-width: 900px;
      background: #B9E5F8;
      border: 4px solid #1C2B33;
      border-radius: 20px;
      padding: 6px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      overflow: hidden;
    }

    .map-zone-interactive {
      cursor: pointer;
      transition: filter 0.2s ease, transform 0.2s ease;
    }
    .map-zone-interactive:hover {
      filter: brightness(1.07) drop-shadow(0 4px 6px rgba(0,0,0,0.25));
    }

    /* Pilihan Kuis */
    .quiz-options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      width: 100%;
      margin-top: 12px;
    }

    .option-card {
      background: #FFFFFF;
      border: 4px solid var(--kayu-gelap);
      border-radius: 18px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.05rem;
      box-shadow: 0 5px 0 var(--kayu-gelap);
      transition: all 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .option-card img {
      width: 100%;
      height: 112px;
      object-fit: contain;
      background: #FFFFFF;
      padding: 4px;
      border-radius: 12px;
      border: 2px solid #E2D8C3;
      margin-bottom: 8px;
    }

    .option-card:hover {
      background: var(--kuning);
      transform: translateY(-3px);
    }

    /* Indikator Step Tantangan 3 Soal */
    .step-dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
    }
    .step-dot {
      padding: 3px 12px;
      border-radius: 12px;
      font-family: 'Fredoka', sans-serif;
      font-size: 0.85rem;
      background: #E2D3B5;
      border: 2px solid var(--kayu-gelap);
      color: var(--kayu-gelap);
    }
    .step-dot.active {
      background: var(--kuning);
      transform: scale(1.06);
    }
    .step-dot.done {
      background: var(--hijau-muda);
      color: #184A2F;
    }

    /* Modal Pop-up */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.68);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 20px;
    }

    .modal-overlay.active { display: flex; }

    .modal-box {
      background: var(--krem);
      border: 6px solid var(--kayu-gelap);
      border-radius: 26px;
      max-width: 520px;
      width: 100%;
      padding: 22px;
      text-align: center;
      box-shadow: 0 12px 0 var(--kayu-gelap);
      animation: popUp 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal-photo {
      width: 100%;
      max-height: 220px;
      object-fit: contain;
      background: #FFFFFF;
      padding: 6px;
      border-radius: 16px;
      border: 4px solid var(--kayu-gelap);
      margin-bottom: 12px;
    }

    @keyframes popUp {
      from { transform: scale(0.82); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .vehicle-float {
      font-size: 4rem;
      display: inline-block;
      animation: bobbing 2.2s ease-in-out infinite;
    }

    @keyframes bobbing {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-10px) rotate(3deg); }
    }

    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      gap: 12px;
    }

    .progress-bar-wrap {
      flex: 1;
      max-width: 340px;
      height: 16px;
      background: rgba(255, 255, 255, 0.5);
      border: 3px solid var(--kayu-gelap);
      border-radius: 20px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--kuning), var(--oranye));
      width: 5%;
      transition: width 0.4s ease;
    }

    @media (max-width: 768px) {
      #app-container { border-radius: 0; border-width: 4px; min-height: 100vh; padding: 12px; }
      .cards-grid { grid-template-columns: repeat(2, 1fr); }
      .bima-box { flex-direction: column; text-align: center; }
    }
  </style>
</head>
<body>

<div id="app-container">
  <header>
    <div class="mission-badge" id="mission-indicator">
      <span>🧭</span> <span id="mission-text">Halaman Utama</span>
    </div>

    <div class="hud-right">
      <div class="badge-tray" title="Koleksi Lencana Petualangan">
        <span>Lencana:</span>
        <div class="badge-slot" id="badge-asiatis" title="Penjelajah Asiatis">🐅</div>
        <div class="badge-slot" id="badge-peralihan" title="Penjelajah Peralihan">🦎</div>
        <div class="badge-slot" id="badge-australis" title="Penjelajah Australis">🦜</div>
        <div class="badge-slot" id="badge-alam" title="Penjaga Alam">🌱</div>
      </div>
      <button class="btn btn-secondary btn-small" onclick="toggleAutoNarration()" id="narration-toggle-btn" title="Aktifkan/Matikan Narasi Suara Otomatis">🗣️ Suara: ON</button>
      <button class="btn btn-secondary btn-small" onclick="toggleSound()" id="sound-btn" title="Efek Suara">🔊</button>
    </div>
  </header>

  <main id="slide-content"></main>

  <footer id="footer-nav">
    <button class="btn btn-secondary" id="btn-prev" onclick="prevSlide()">⬅️ Kembali</button>
    <div class="progress-bar-wrap">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <button class="btn btn-primary" id="btn-next" onclick="nextSlide()">Lanjut ➡️</button>
  </footer>
</div>

<!-- MODAL POP-UP -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box" id="modal-box">
    <img id="modal-img" class="modal-photo" src="" alt="Visual Nyata" style="display:none;" />
    <div id="modal-icon" style="font-size: 3.6rem; margin-bottom: 8px; display:none;">🌿</div>
    <h2 id="modal-title" style="font-family: 'Fredoka', sans-serif; color: var(--hijau-hutan); margin-bottom: 8px;">Judul</h2>
    <p id="modal-desc" style="font-size: 1.05rem; line-height: 1.5; margin-bottom: 14px; font-weight: 700;">Deskripsi</p>
    <div style="margin-bottom: 16px;">
      <button class="btn-audio-inline" id="modal-speak-btn" style="font-size:0.95rem; padding:6px 14px;">🔊 Dengarkan Penjelasan</button>
    </div>
    <div id="modal-actions"></div>
  </div>
</div>

<script>
  /* ================= AUDIO ENGINE & NARASI SUARA INDONESIA ================= */
  let soundEnabled = true;
  let autoNarration = true;
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  function playTone(freq, type = 'sine', duration = 0.15, delay = 0) {
    if (!soundEnabled) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delay);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime + delay);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(audioCtx.currentTime + delay);
    osc.stop(audioCtx.currentTime + delay + duration);
  }

  function sfxClick() { playTone(520, 'triangle', 0.09); }
  function sfxCorrect() {
    playTone(523.25, 'sine', 0.15, 0);
    playTone(659.25, 'sine', 0.15, 0.12);
    playTone(783.99, 'sine', 0.25, 0.24);
  }
  function sfxWrong() {
    playTone(300, 'sawtooth', 0.2, 0);
    playTone(230, 'sawtooth', 0.28, 0.18);
  }
  function sfxMagic() {
    [440, 554, 659, 880].forEach((f, i) => playTone(f, 'sine', 0.2, i * 0.08));
  }

  function speakText(text, force = false) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    if (!soundEnabled) return;
    if (!autoNarration && !force) return;

    const cleanText = text.replace(/<[^>]*>?/gm, '').replace(/["“”]/g, '');
    const utterance = new SpeechSynthesisUtterance(cleanText);
    utterance.lang = 'id-ID';
    utterance.rate = 1.02;
    utterance.pitch = 1.55;

    const voices = window.speechSynthesis.getVoices();
    const idVoice = voices.find(v => v.lang.includes('id') || v.lang.includes('ID'));
    if (idVoice) utterance.voice = idVoice;

    window.speechSynthesis.speak(utterance);
  }

  if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
  }

  function toggleSound() {
    soundEnabled = !soundEnabled;
    if (!soundEnabled && 'speechSynthesis' in window) window.speechSynthesis.cancel();
    document.getElementById('sound-btn').textContent = soundEnabled ? '🔊' : '🔇';
  }

  function toggleAutoNarration() {
    autoNarration = !autoNarration;
    if (!autoNarration && 'speechSynthesis' in window) window.speechSynthesis.cancel();
    document.getElementById('narration-toggle-btn').textContent = autoNarration ? '🗣️ Suara: ON' : '🗣️ Suara: OFF';
  }

  function makeFallbackSVG(label, bgColor = "#246B45") {
    const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='400' height='260' viewBox='0 0 400 260'>
      <rect width='400' height='260' fill='${bgColor}'/>
      <text x='50%' y='45%' dominant-baseline='middle' text-anchor='middle' fill='#F6E9CF' font-family='sans-serif' font-weight='bold' font-size='20'>${label}</text>
      <text x='50%' y='62%' dominant-baseline='middle' text-anchor='middle' fill='#F3C96B' font-family='sans-serif' font-size='14'>(Simpan file di folder /)</text>
    </svg>`;
    return `data:image/svg+xml;utf8,${encodeURIComponent(svg)}`;
  }

  function getBimaSVG(expression = 'happy') {
    const mouth = expression === 'surprised'
      ? `<circle cx="50" cy="67" r="5" fill="#7A2E1D"/>`
      : expression === 'curious'
      ? `<path d="M44 66 Q50 63 56 66" stroke="#7A2E1D" stroke-width="3" fill="none" stroke-linecap="round"/>`
      : `<path d="M41 63 Q50 73 59 63 Z" fill="#D94E4E" stroke="#7A2E1D" stroke-width="2"/>`;

    return `
      <svg viewBox="0 0 100 100" width="60" height="60">
        <circle cx="50" cy="50" r="48" fill="#F3C96B"/>
        <path d="M25 95 C25 76, 75 76, 75 95" fill="#246B45"/>
        <path d="M35 80 L50 92 L65 80" fill="#F6E9CF"/>
        <circle cx="50" cy="52" r="23" fill="#FAD2B1"/>
        <path d="M27 46 C27 28, 73 28, 73 46 C68 38, 32 38, 27 46 Z" fill="#3A2314"/>
        <ellipse cx="50" cy="33" rx="34" ry="8" fill="#C9823E" stroke="#7A4419" stroke-width="2"/>
        <path d="M31 33 C31 18, 69 18, 69 33 Z" fill="#E09E56" stroke="#7A4419" stroke-width="2"/>
        <rect x="31" y="29" width="38" height="4" fill="#246B45"/>
        <circle cx="42" cy="51" r="3.2" fill="#2B2118"/>
        <circle cx="58" cy="51" r="3.2" fill="#2B2118"/>
        <circle cx="43" cy="50" r="1" fill="#FFF"/>
        <circle cx="59" cy="50" r="1" fill="#FFF"/>
        <circle cx="36" cy="57" r="3" fill="#F29B7E" opacity="0.7"/>
        <circle cx="64" cy="57" r="3" fill="#F29B7E" opacity="0.7"/>
        ${mouth}
      </svg>
    `;
  }

  function renderBimaDialogue(expression, text) {
    const safeSpeak = text.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    return `
      <div class="bima-box">
        <div class="bima-avatar">${getBimaSVG(expression)}</div>
        <div class="bima-speech">
          <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap;">
            <span class="bima-name">Bima - Penjelajah Cilik</span>
            <button class="btn-audio-inline" onclick="speakText('${safeSpeak}', true)">🔊 Dengarkan Bima</button>
          </div>

  function showBioModal(key) {
    sfxClick();
    const item = bioData[key];
    const imgEl = document.getElementById('modal-img');
    const iconEl = document.getElementById('modal-icon');

    iconEl.style.display = 'none';
    imgEl.style.display = 'block';
    imgEl.src = item.img;
    imgEl.onerror = function() { this.src = makeFallbackSVG(item.title); };

    document.getElementById('modal-title').style.color = "var(--hijau-hutan)";
    document.getElementById('modal-title').textContent = item.title;
    document.getElementById('modal-desc').textContent = item.desc;

    const fullNarration = `${item.title}. ${item.desc}`;
    document.getElementById('modal-speak-btn').onclick = () => speakText(fullNarration, true);
    document.getElementById('modal-actions').innerHTML = `<button class="btn btn-green" onclick="closeModal()">Tutup Informasi ✅</button>`;
    document.getElementById('modal-overlay').classList.add('active');

    speakText(fullNarration);
  }

  function showFeedbackModal(isCorrect, title, message, btnLabel, onContinue) {
    if (isCorrect) sfxCorrect(); else sfxWrong();
    document.getElementById('modal-img').style.display = 'none';
    const iconEl = document.getElementById('modal-icon');
    iconEl.style.display = 'block';
    iconEl.textContent = isCorrect ? "🌟" : "🤔";

    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-title').style.color = isCorrect ? "var(--hijau-hutan)" : "#B83A2D";
    document.getElementById('modal-desc').textContent = message;

    document.getElementById('modal-speak-btn').onclick = () => speakText(`${title}. ${message}`, true);

    if (isCorrect) {
      document.getElementById('modal-actions').innerHTML = `<button class="btn btn-primary" id="modal-next-btn">${btnLabel || 'Lanjut Petualangan ➡️'}</button>`;
      document.getElementById('modal-next-btn').onclick = () => {
        closeModal();
        if (onContinue) onContinue();
      };
    } else {
      document.getElementById('modal-actions').innerHTML = `<button class="btn btn-secondary" onclick="closeModal()">🔄 Coba Lagi</button>`;
    }
    document.getElementById('modal-overlay').classList.add('active');
    speakText(`${title}. ${message}`);
  }

  function closeModal() {
    sfxClick();
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    document.getElementById('modal-overlay').classList.remove('active');
  }

  function unlockBadge(type) {
    badges[type] = true;
    const el = document.getElementById(`badge-${type}`);
    if (el) el.classList.add('unlocked');
  }

  function goToSlide(num) {
    sfxClick();
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    currentSlide = num;
    renderSlide();
  }

  function nextSlide() {
    if (currentSlide < 22) goToSlide(currentSlide + 1);
  }

  function prevSlide() {
    if (currentSlide === 3) goToSlide(1);
    else if (currentSlide === 4) goToSlide(2);
    else if (currentSlide > 1) goToSlide(currentSlide - 1);
  }

  function resetGame() {
    sfxClick();
    bookOpened = false;
    floraRevealed = false;
    faunaRevealed = false;
    badges = { asiatis: false, peralihan: false, australis: false, alam: false };
    regionStep = { 1: 0, 2: 0, 3: 0, 4: 0 };
    quizAnswers = { q1: null, q2: null, q3: null, q4: null, q5: null };
    ['asiatis', 'peralihan', 'australis', 'alam'].forEach(b => {
      document.getElementById(`badge-${b}`).classList.remove('unlocked');
    });
    goToSlide(1);
  }

  function renderBioCard(key, shortTitle, categoryLabel) {
    const item = bioData[key];
    return `
      <div class="bio-card" onclick="showBioModal('${key}')">
        <img class="real-photo-thumb" src="${item.img}" alt="${shortTitle}" onerror="this.src=makeFallbackSVG('${shortTitle}')" />
        <h4>${shortTitle}</h4>
        <span class="tag-hint">${categoryLabel} • Klik foto</span>
      </div>
    `;
  }

  /* ================= RENDER TANTANGAN 3 SOAL PER WILAYAH (SEMUA PAKAI GAMBAR) ================= */
  function renderRegionChallengeSlide(stage) {
    const data = regionChallenges[stage];
    const stepIdx = regionStep[stage];
    const qObj = data.questions[stepIdx];

    const optionsHTML = qObj.options.map((opt, idx) => {
      return `
        <div class="option-card" onclick="handleRegionAnswer(${stage}, ${idx})">
          <img src="${opt.img}" alt="${opt.label}" onerror="this.src=makeFallbackSVG('${opt.fallback}')" />
          <span>${opt.label}</span>
        </div>
      `;
    }).join('');

    const dotsHTML = [0, 1, 2].map(i => {
      let cls = 'step-dot';
      if (i < stepIdx) cls += ' done';
      else if (i === stepIdx) cls += ' active';
      return `<span class="${cls}">Soal ${i + 1}/3 ${i < stepIdx ? '✅' : ''}</span>`;
    }).join('');

    const safeSpeakQ = qObj.speak.replace(/'/g, "\\'");

    return `
      <div class="parchment-panel" style="max-width:830px; width:100%; text-align:center;">
        <div style="display:flex; justify-content:center; align-items:center; gap:8px; flex-wrap:wrap;">
          <span style="background:${data.badgeColor}; color:#fff; padding:4px 14px; border-radius:20px; font-family:'Fredoka',sans-serif;">
            ${data.badgeTitle}
          </span>
          <button class="btn-audio-inline" onclick="speakText('${safeSpeakQ}', true)">🔊 Bacakan Soal</button>
        </div>

        <div class="step-dots">${dotsHTML}</div>

        <h2 style="font-family:'Fredoka',sans-serif; color:var(--hijau-hutan); margin:10px 0 4px; font-size:1.3rem;">
          "${qObj.question}"
        </h2>

        <div class="quiz-options">
          ${optionsHTML}
        </div>
      </div>
      ${renderBimaDialogue('curious', data.bimaHint)}
    `;
  }

  function handleRegionAnswer(stage, optIndex) {
    const data = regionChallenges[stage];
    const stepIdx = regionStep[stage];
    const chosen = data.questions[stepIdx].options[optIndex];

    if (chosen.correct) {
      if (stepIdx < 2) {
        showFeedbackModal(
          true,
          `Soal ${stepIdx + 1} dari 3 Benar! 🎉`,
          chosen.feedback,
          `Lanjut ke Soal ${stepIdx + 2}/3 ➡️`,
          () => {
            regionStep[stage] = stepIdx + 1;
            renderSlide();
          }
        );
      } else {
        unlockBadge(data.badgeKey);
        showFeedbackModal(
          true,
          "Semua Tantangan Selesai! 🏆",
          chosen.feedback,
          "Lanjut Petualangan ➡️",
          () => {
            goToSlide(data.nextSlide);
          }
        );
      }
    } else {
      showFeedbackModal(false, "Kurang Tepat, Coba Lagi!", chosen.feedback);
    }
  }

                ${renderQuizBtn('q5', 'C', 'C. Menjaga habitat', true)}
              </div>
            </div>
          </div>
        `;
        break;

      /* SLIDE 21: HASIL PETUALANGAN */
      case 21:
        sfxMagic();
        missionText.textContent = "Hasil Petualangan";
        btnNext.innerHTML = "Penutup 🎉";
        btnNext.onclick = () => goToSlide(22);
        const totalScore = Object.values(quizAnswers).filter(v => v === true).length * 20;
        const displayName = studentName.trim() !== "" ? studentName.trim() : "Penjelajah Cilik";
        autoTextToRead = `Petualangan selesai! Selamat ${displayName}, nilai kamu adalah ${totalScore} dari 100! Teruslah belajar dan menjaga alam sekitar!`;

        main.innerHTML = `
          <div style="max-width:780px; width:100%; text-align:center;">
            <div class="wood-board" style="margin-bottom:12px;">
              <h2 class="wood-title" style="font-size:1.95rem;">🏆 PETUALANGAN SELESAI! 🏆</h2>
            </div>

            <div class="parchment-panel">
              <div style="font-size:3rem; margin-bottom:4px;">🥇⭐⭐⭐</div>
              <p style="font-size:1.15rem; font-weight:800;">Nama Penjelajah: <span style="color:var(--hijau-hutan);">${escapeHTML(displayName)}</span></p>
              <div style="background:var(--kuning); border:4px solid var(--kayu-gelap); border-radius:18px; padding:10px 24px; display:inline-block; margin:10px 0;">
                <span style="font-family:'Fredoka',sans-serif; font-size:2.1rem; color:var(--teks-gelap);">Nilai: ${totalScore} / 100</span>
              </div>

              <p style="font-weight:800; margin-top:4px;">Lencana yang Berhasil Dikumpulkan:</p>
              <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:8px;">
                <span style="background:#E6F5E1; border:2px solid var(--hijau-hutan); padding:5px 12px; border-radius:14px; font-weight:800;">🐅 Penjelajah Asiatis</span>
                <span style="background:#FFF3D6; border:2px solid var(--oranye); padding:5px 12px; border-radius:14px; font-weight:800;">🦎 Penjelajah Peralihan</span>
                <span style="background:#EDE9FE; border:2px solid #6B46C1; padding:5px 12px; border-radius:14px; font-weight:800;">🦜 Penjelajah Australis</span>
                <span style="background:#E0F2FE; border:2px solid #0284C7; padding:5px 12px; border-radius:14px; font-weight:800;">🌱 Penjaga Alam</span>
              </div>
            </div>

            ${renderBimaDialogue('happy', `"Hebat, ${escapeHTML(displayName)}! Kamu telah berhasil menjelajahi kekayaan flora dan fauna Indonesia. Teruslah belajar dan menjaga alam sekitar!"`)}
          </div>
        `;
        break;

      /* SLIDE 22: PENUTUP */
      case 22:
        missionText.textContent = "Penutup Ekspedisi";
        footer.style.display = 'none';
        autoTextToRead = "Wah, seru sekali petualangan kita! Ingat, kekayaan alam Indonesia adalah tanggung jawab kita bersama. Yuk, jaga dan lestarikan alam Indonesia! Sampai jumpa!";
        main.innerHTML = `
          <div style="max-width:800px; width:100%; text-align:center;">
            <div class="wood-board" style="margin-bottom:14px;">
              <h2 class="wood-title" style="font-size:2.2rem;">SAMPAI JUMPA! 👋</h2>
              <p style="color:#FFF8E7; font-family:'Fredoka',sans-serif; font-size:1.2rem; margin-top:6px;">
                "Jaga dan lestarikan kekayaan alam Indonesia!"
              </p>
            </div>

            <div class="parchment-panel" style="margin-bottom:12px;">
              <div class="preview-strip">
                <img src="${bioData.orangutan.img}" alt="Orangutan" onerror="this.src=makeFallbackSVG('orangutan.jpg')" />
                <img src="${bioData.komodo.img}" alt="Komodo" onerror="this.src=makeFallbackSVG('komodo.jpg')" />
                <img src="${bioData.cenderawasih.img}" alt="Cenderawasih" onerror="this.src=makeFallbackSVG('cenderawasih.jpg')" />
                <img src="${bioData.rafflesia.img}" alt="Rafflesia" onerror="this.src=makeFallbackSVG('rafflesia.jpg')" />
              </div>
              <p style="font-weight:800; font-size:1.02rem;">
                Media Pembelajaran Interaktif IPAS Kelas V SD • Disusun oleh Kelompok 02
              </p>
            </div>

            ${renderBimaDialogue('happy', '"Wah, seru sekali petualangan kita! Ingat, kekayaan alam Indonesia adalah tanggung jawab kita bersama. Yuk, jaga dan lestarikan alam Indonesia!"')}

            <div style="display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin-top:14px;">
              <button class="btn btn-primary" onclick="resetGame()">🔄 Main Lagi dari Awal</button>
              <button class="btn btn-green" onclick="showExitConfirm()">✅ Selesai</button>
            </div>
          </div>
        `;
        break;
    }

    if (autoTextToRead) {
      speakText(autoTextToRead);
    }
  }

  /* ================= HELPER INTERAKSI KHUSUS ================= */
  function openMagicBook() {
    sfxMagic();
    bookOpened = true;
    renderSlide();
  }

  function revealConcept(type) {
    sfxCorrect();
    if (type === 'flora') {
      floraRevealed = true;
      speakText("Flora adalah berbagai jenis tumbuhan seperti pohon, bunga, dan rumput yang hidup di suatu wilayah.", true);
    }
    if (type === 'fauna') {
      faunaRevealed = true;
      speakText("Fauna adalah berbagai jenis hewan seperti mamalia, burung, reptil, dan ikan yang hidup di suatu wilayah.", true);
    }
    renderSlide();
  }

  function renderQuizBtn(qKey, optLetter, label, isCorrect) {
    const isThisSelected = document.body.dataset[qKey] === optLetter;
    let bg = "#FFFFFF";
    if (isThisSelected) {
      bg = isCorrect ? "var(--hijau-muda)" : "#F8B4B4";
    }
    return `
      <button class="option-card" style="padding:10px; font-size:0.98rem; background:${bg};"
        onclick="answerFinalQuiz('${qKey}', '${optLetter}', ${isCorrect})">
        ${label} ${isThisSelected ? (isCorrect ? '✅' : '❌') : ''}
      </button>
    `;
  }

  function answerFinalQuiz(qKey, optLetter, isCorrect) {
    if (isCorrect) {
      sfxCorrect();
      speakText("Jawaban tepat!", true);
    } else {
      sfxWrong();
      speakText("Kurang tepat, coba pilih jawaban lain.", true);
    }
    document.body.dataset[qKey] = optLetter;
    quizAnswers[qKey] = isCorrect;
    renderSlide();
  }

  function showExitConfirm() {
    sfxClick();
    document.getElementById('modal-img').style.display = 'none';
    const iconEl = document.getElementById('modal-icon');
    iconEl.style.display = 'block';
    iconEl.textContent = "👋";

    document.getElementById('modal-title').style.color = "var(--hijau-hutan)";
    document.getElementById('modal-title').textContent = "Terima Kasih Sudah Berpetualang!";
    document.getElementById('modal-desc').textContent = "Kamu bisa menutup tab browser ini kapan saja atau kembali menjelajah bersama Bima.";
    document.getElementById('modal-speak-btn').onclick = () => speakText("Terima kasih sudah berpetualang bersama Bima!", true);
    document.getElementById('modal-actions').innerHTML = `<button class="btn btn-primary" onclick="closeModal()">Kembali ke Permainan</button>`;
    document.getElementById('modal-overlay').classList.add('active');
  }

  function escapeHTML(str) {
    return str.replace(/[&<>'"]/g, tag => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
    }[tag]));
  }

  renderSlide();
</script>
</body>
</html>
